<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الديون - معرض كاظم البهادلي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="toast-container"></div>

    <div id="lock-screen" style="display: none;">
        <div class="lock-content glass-card">
            <h2>🔒 قفل التطبيق</h2>
            <p>أدخل كلمة المرور للمتابعة</p>
            <input type="password" id="app-password-input" class="glass-input" placeholder="كلمة المرور">
            <button onclick="checkAppPassword()" class="glass-btn primary">دخول</button>
        </div>
    </div>

    <div id="welcome-screen">
        <div class="welcome-content">
            <h1>معرض كاظم البهادلي</h1>
            <p>جارٍ التحميل...</p>
        </div>
    </div>

    <div id="app" style="display: none;">
        <header class="glass-header">
            <h2 id="header-title">معرض كاظم البهادلي</h2>
        </header>

        <main>
            <section id="tab-sales" class="tab-content active">
                <h3>تسجيل بيع جديد</h3>
                <div class="glass-card">
                    <select id="sale-customer-select" class="glass-input">
                        <option value="">اختر الزبون</option>
                    </select>
                    <textarea id="sale-item" placeholder="اسم المادة (اضغط Enter لسطر جديد)" class="glass-input" rows="3"></textarea>
                    <input type="number" id="sale-amount" placeholder="السعر الكلي" class="glass-input">
                    <button onclick="addSale()" class="glass-btn primary">حفظ البيع</button>
                </div>
            </section>

            <section id="tab-debts" class="tab-content">
                <h3>قائمة الديون</h3>
                <div id="debts-list" class="list-container">
                    </div>
            </section>

            <section id="tab-customers" class="tab-content">
                <div class="top-actions">
                    <button onclick="openCustomerModal()" class="glass-btn action">+ إضافة زبون</button>
                </div>
                <h3>الزبائن</h3>
                <div id="customers-list" class="list-container">
                    </div>
            </section>

            <section id="tab-settings" class="tab-content">
                <h3>الإعدادات</h3>
                
                <div class="glass-card">
                    <h4>🔐 الأمان</h4>
                    <input type="password" id="current-pass" placeholder="كلمة المرور الحالية" class="glass-input">
                    <input type="password" id="new-pass" placeholder="كلمة المرور الجديدة" class="glass-input">
                    <button onclick="changeAppPassword()" class="glass-btn primary">تغيير كلمة المرور</button>
                </div>

                <div class="glass-card">
                    <h4>💾 النسخ الاحتياطي</h4>
                    <button onclick="downloadBackup()" class="glass-btn action">تنزيل نسخة احتياطية (ملف)</button>
                    <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 10px 0;">
                    <p style="font-size: 0.8em; margin-bottom: 5px;">استعادة نسخة:</p>
                    <input type="file" id="backup-file" class="glass-input" accept=".json">
                    <button onclick="uploadBackup()" class="glass-btn whatsapp">رفع واستعادة النسخة</button>
                </div>
            </section>
        </main>

        <nav class="bottom-nav glass-nav">
            <button onclick="switchTab('tab-customers')" class="nav-item">
                <span>👥</span> الزبائن
            </button>
            <button onclick="switchTab('tab-sales')" class="nav-item active">
                <span>🏠</span> البيع
            </button>
            <button onclick="switchTab('tab-debts')" class="nav-item">
                <span>💰</span> الديون
            </button>
            <button onclick="switchTab('tab-settings')" class="nav-item">
                <span>⚙️</span> الإعدادات
            </button>
        </nav>
    </div>

    <div id="add-customer-modal" class="modal">
        <div class="modal-content glass-card">
            <h3 id="modal-title">زبون جديد</h3>
            <input type="hidden" id="customer-id-hidden"> <input type="text" id="new-customer-name" placeholder="اسم الزبون" class="glass-input">
            
            <div class="phone-input-group">
                <span class="country-code" dir="ltr">+964</span>
                <input type="tel" id="new-customer-phone" placeholder="77xxxxxxxxx" class="glass-input" style="direction: ltr; text-align: left;">
            </div>

            <div class="modal-actions">
                <button onclick="saveCustomer()" class="glass-btn primary" id="save-customer-btn">حفظ</button>
                <button onclick="toggleModal('add-customer-modal')" class="glass-btn danger">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="supabase_config.js"></script>
    <script src="script.js"></script>
    <script>
        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
